<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>GRENER® | Contar Planta</title>
<style>
:root{--forest:#1f3a2e;--fdk:#132821;--bg:#f6f3ea;--bg2:#ece6d6;--card:#fff;--ink:#2a2620;--soil:#7a5232;--gold:#a9812f;--line:#d8cfb8;--mut:#6b6255;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17211c;--bg2:#22302a;--card:#1d2a24;--ink:#efe9da;--line:#3a4a41;--mut:#b5ad9c}}
:root[data-theme=dark]{--bg:#17211c;--bg2:#22302a;--card:#1d2a24;--ink:#efe9da;--line:#3a4a41;--mut:#b5ad9c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif;padding-bottom:84px}
header{background:var(--forest);color:#f6f3ea;border-bottom:3px solid var(--gold);padding:8px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header img{width:42px;height:42px;border-radius:50%;background:#fff;border:2px solid var(--gold);padding:2px}
header b{font-size:15px;display:block}header small{opacity:.8;font-size:11px}
#gps{margin-left:auto;font-size:11px;padding:4px 8px;border-radius:12px;background:rgba(255,255,255,.15);white-space:nowrap}
main{padding:12px 14px;max-width:760px;margin:auto}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--forest);display:flex;border-top:3px solid var(--gold);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;background:none;border:0;color:#d9d3c2;padding:12px 2px;font-size:12px}nav button.on{background:var(--gold);color:var(--fdk);font-weight:700}
h2{font-size:17px;margin:4px 0 10px;border-bottom:2px solid var(--gold);padding-bottom:4px;color:var(--forest)}
@media(prefers-color-scheme:dark){h2{color:#cfe3d4}}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.k div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px}.k b{display:block;font:700 20px ui-monospace,Menlo,monospace;color:var(--forest)}.k span{font-size:11px;color:var(--mut)}
@media(prefers-color-scheme:dark){.k b{color:#cfe3d4}}
button.b,.b{background:var(--forest);color:#fff;border:0;border-radius:8px;padding:12px;font-size:14px;font-weight:600;min-height:46px}
.b.g{background:var(--gold);color:var(--fdk)}.b.o{background:none;color:var(--ink);border:1px solid var(--line)}.b.r{background:#a44834}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.st button{min-height:84px;border-radius:12px;font-size:17px;font-weight:700;border:3px solid #1a1a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.st i{font-style:normal;font-size:26px}
.chip{display:inline-block;padding:7px 11px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:2px;font-size:13px}.chip.on{background:var(--forest);color:#fff;border-color:var(--gold)}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 2px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit}
.w{background:#fdf0d5;color:#5a4410;border-left:4px solid var(--gold);padding:8px 10px;border-radius:4px;margin:8px 0;font-size:13px}.w.e{background:#f6e3dc;color:#6e2a1a;border-color:#a44834}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px;border-bottom:1px solid var(--line);text-align:right}td:first-child,th:first-child{text-align:left}
.dot{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid #1a1a1a;vertical-align:-2px;margin-right:4px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#1a1a1a;color:#fff;padding:9px 14px;border-radius:20px;font-size:13px;z-index:9;display:none;max-width:90%}
#sv{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
small.m{color:var(--mut)}
.kpi-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:10px 0}.kpi{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px;display:flex;gap:10px;align-items:center;min-width:0}.donut{width:64px;height:64px;flex:0 0 64px;border-radius:50%;display:grid;place-items:center;position:relative}.donut:after{content:'';position:absolute;inset:9px;background:var(--card);border-radius:50%}.donut b{z-index:1;font-size:13px}.kpi strong{display:block;font-size:15px}.kpi small{display:block;color:var(--mut);font-size:12px}.kpi .formula{margin-top:3px;font-size:11px;color:var(--mut)}@media(max-width:420px){.kpi-grid{grid-template-columns:1fr}.kpi{padding:8px}.donut{width:58px;height:58px;flex-basis:58px}}
body{font-size:17px}html{overflow-x:hidden}
nav button{font-size:13px;padding:16px 2px;font-weight:600}
button.b,.b{min-height:58px;font-size:17px}.b.o{border:2px solid var(--ink)}
.st button{min-height:112px;font-size:23px}.st i{font-size:34px}
.chip{font-size:16px;padding:10px 14px}input,select,textarea{font-size:17px;padding:12px}
.w{font-size:15px}td,th{font-size:14px}.k span,header small{font-size:13px}
tr[data-a]{cursor:pointer}
#sv svg{width:100%;height:auto;display:block}#sv.sc svg{width:auto}
#ok{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);padding:26px 30px;border:6px solid #000;border-radius:18px;font:700 34px/1.2 system-ui,sans-serif;z-index:30;display:none;text-align:center;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#print{display:none}
@media print{body>*:not(#print){display:none!important}#print{display:block!important;color:#000;font-size:11px}body{background:#fff;padding:0;zoom:1!important}#print svg{width:100%;height:auto}#print table{font-size:9px}#print tr{break-inside:avoid}@page{size:A4 landscape;margin:10mm}}
</style></head><body>

<script>
const ST={sana:{n:'Sana',c:'#3f8f4f',t:'#fff',s:'✓'},danada:{n:'Dañada',c:'#e6c200',t:'#1a1a1a',s:'!'},muerta:{n:'Muerta',c:'#1a1a1a',t:'#fff',s:'✕'},vacia:{n:'Vacía',c:'#fff',t:'#1a1a1a',s:'○'}};
const TABS=[['cap','Captura'],['res','Resumen'],['dat','Datos'],['dia','Diagrama'],['exp','Exportar'],['pry','Proyecto']];
let pre=null,z=1,db={projects:[],active:null},idb=null,tab='cap',fix=null,gst='buscando',pend=null,editId=null,newRow=false,armed=null,saved='',memOnly=false;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const P=()=>db.projects.find(p=>p.id===db.active),pad=n=>String(n).padStart(3,'0'),now=()=>new Date().toISOString();
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3200)};
/* persistencia: IndexedDB (un registro 'db') */
const open=()=>new Promise(r=>{try{const q=indexedDB.open('contarplanta',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const kv=(m,v,k='db')=>new Promise(r=>{if(!idb)return r(null);try{const t=idb.transaction('kv',m==='r'?'readonly':'readwrite'),s=t.objectStore('kv'),q=m==='r'?s.get(k):s.put(v,k);q.onsuccess=()=>r(m==='r'?q.result:true);q.onerror=()=>r(null);t.onabort=()=>r(null)}catch(e){r(null)}});
let sh;function save(){const p=P();if(p)p.mod=Date.now();clearTimeout(sh);sh=setTimeout(async()=>{const ok=await kv('w',db);if(ok&&Date.now()-(save.sn||0)>3e5){save.sn=Date.now();kv('w',{t:now(),db},'snap'+(save.i=((save.i||0)+1)%3))}memOnly=!ok;saved=ok?new Date().toLocaleTimeString().slice(0,5):'';foot()},250)}
const foot=()=>{const s=$('#sub');if(s)s.textContent=memOnly?'⚠ Sin persistencia local (solo memoria)':saved?'Guardado en este dispositivo '+saved:'Inventario de plantación georreferenciado'};
const hist=(p,act,ent,o,n)=>p.hist.push({id:uid(),t:now(),act,ent,old:o??null,new:n??null});
/* GPS */
function watch(){if(!navigator.geolocation){gst='sin soporte';return gps()}navigator.geolocation.watchPosition(g=>{fix={lat:g.coords.latitude,lng:g.coords.longitude,acc:g.coords.accuracy,t:Date.now()};gst='ok';gps()},e=>{gst=e.code===1?'sin permiso':'sin señal';gps()},{enableHighAccuracy:true,maximumAge:5000,timeout:20000})}
const lim=()=>(P()?.gpsMax)||10,good=()=>fix&&Date.now()-fix.t<20000&&fix.acc<=lim();
function gps(){const g=$('#gps');g.textContent=fix&&gst==='ok'?`GPS ±${fix.acc.toFixed(0)} m ${fix.acc<=lim()?'✓':'⚠'}`:'GPS '+gst}
const mkLoc=f=>({lat:f.lat,lng:f.lng,acc:f.acc,t:new Date(f.t).toISOString(),crs:'EPSG:4326',src:'observada'});
/* modelo */
const cur=x=>{for(let i=x.evals.length;i--;)if(!x.evals[i].void)return x.evals[i]};
const live=(p,r)=>p.pos.filter(x=>!x.void&&(!r||x.rowId===r));
const nextN=(p,r)=>Math.max(0,...live(p,r.id).map(x=>x.n))+1;
const spOf=(p,id)=>p.poly.species.find(s=>s.id===id)||{abbr:'?',nombre:'?'};
function stats(p,r){const o={sana:0,danada:0,muerta:0,vacia:0,sc:0,sp:{}};live(p,r).forEach(x=>{const e=cur(x);o[e.estado]++;if(!x.loc)o.sc++;const k=e.sp;o.sp[k]=o.sp[k]||{sana:0,danada:0,muerta:0,vacia:0};o.sp[k][e.estado]++});o.C=o.sana+o.danada+o.muerta+o.vacia;return o}
const pc=(n,d)=>d?(n/d*100).toFixed(1)+'% <small class=m>('+n+'/'+d+')</small>':'no calculable';
function commit(est,loc,sp,obs,posId){const p=P(),by=p.capturador;let x;
 if(posId){x=p.pos.find(y=>y.id===posId);const old=cur(x);hist(p,'corrección','posición '+x.code,old.estado,est)}
 else{const r=p.rows.find(y=>y.id===p.curRow),n=nextN(p,r);x={id:uid(),rowId:r.id,n,code:`${p.code}-${p.poly.code}-${r.code}-P${pad(n)}`,loc:loc,void:false,evals:[]};p.pos.push(x);if(!p.inicio){p.inicio=now();p.estado='activo'}}
 if(!x.loc&&loc)x.loc=loc;
 const e={t:now(),estado:est,sp,obs:obs||'',by,loc:loc||null,void:false};x.evals.push(e);p.stack.push({pos:x.id,t:e.t});
 if(!posId)hist(p,'registro','posición '+x.code,null,est);
 editId=null;pend=null;if(!p.poly.repetir)p.sp=null;save();render();flash(`${x.code.split('-').pop()} · ${ST[est].n}${loc||posId?'':' · sin GPS'}`,ST[est].c,ST[est].t)}
function tap(est){
 const p=P();if(!p||p.estado==='pausado'||p.estado==='finalizado')return toast('Levantamiento '+(p?.estado||'sin proyecto'));
 const old=editId?p.pos.find(y=>y.id===editId):null;
 const obs=(($('#obs')||{}).value||'')||(old?cur(old).obs||'':'');
 if(editId)return commit(est,null,cur(old).sp,obs,editId);
 if(!p.curRow)return toast('Crea o elige una hilera');
 const sp=p.poly.species.length>1?p.sp:p.poly.species[0].id;if(!sp)return toast('Elige la especie');
 /* GPS auxiliar: se registra la lectura disponible, si existe, sin bloquear el recuento. */
 return commit(est,fix?mkLoc(fix):null,sp,obs)
}
/* acciones */
const act={
 tab:d=>{tab=d.t;render()},
 st:d=>tap(d.e),
 sp:d=>{P().sp=d.id;render()},
 sel:d=>{P().curRow=d.id;newRow=false;render()},
 nr:()=>{newRow=true;render()},
 newrow:d=>{const p=P(),o=p.poly.orient;if(p.curRow){const r=p.rows.find(y=>y.id===p.curRow);if(r.estado==='en curso'&&live(p,r.id).length){r.estado='parcial';hist(p,'hilera parcial','hilera '+r.code)}}
  const n=p.rows.length+1,r={id:uid(),code:'H'+n,order:n,orient:o,estado:'en curso',exc:d.x==='exc'};p.rows.push(r);p.curRow=r.id;newRow=false;hist(p,r.exc?'hilera con excepción de recorrido':'hilera creada','hilera '+r.code);save();render();if(r.exc)toast('Excepción de recorrido registrada')},
 endrow:()=>{const p=P(),r=p.rows.find(y=>y.id===p.curRow);if(!r)return;if(armed!=='end'){armed='end';setTimeout(()=>{armed=null;render()},4000);return render()}armed=null;r.estado='finalizada';hist(p,'hilera finalizada','hilera '+r.code);p.curRow=null;newRow=true;save();render()},
 edit:d=>{editId=d.id;render()},noedit:()=>{editId=null;render()},
 undo:()=>{const p=P(),s=p.stack.pop();if(!s)return toast('Nada que deshacer');const x=p.pos.find(y=>y.id===s.pos),e=x.evals.find(y=>y.t===s.t);e.void=true;if(!x.evals.some(y=>!y.void))x.void=true;hist(p,'deshacer','posición '+x.code,e.estado);save();render();toast('Última acción deshecha')},
 retry:()=>{if(!navigator.geolocation)return;$('#gb').textContent='Buscando…';navigator.geolocation.getCurrentPosition(g=>{fix={lat:g.coords.latitude,lng:g.coords.longitude,acc:g.coords.accuracy,t:Date.now()};gst='ok';gps();if(good())commit(pend.est,mkLoc(fix),pend.sp,pend.obs);else{toast('Precisión insuficiente: ±'+fix.acc.toFixed(0)+' m');render()}},()=>{toast('Sin ubicación válida');render()},{enableHighAccuracy:true,timeout:10000,maximumAge:0})},
 nogps:()=>commit(pend.est,null,pend.sp,pend.obs),cancel:()=>{pend=null;render()},
 pause:()=>{const p=P();p.estado=p.estado==='pausado'?(p.inicio?'activo':'config'):'pausado';hist(p,p.estado==='pausado'?'pausa':'reanuda','proyecto');save();render()},
 fin:()=>{const p=P();if(armed!=='fin'){armed='fin';setTimeout(()=>{armed=null;render()},4000);return render()}armed=null;p.estado='finalizado';p.fin=now();hist(p,'finalizado','proyecto');save();render()},
 reopen:()=>{const p=P();p.estado='activo';p.fin=null;hist(p,'reabierto','proyecto');save();render()},
 rep:()=>{const p=P();p.poly.repetir=!p.poly.repetir;save();render()},
 vtx:()=>{const p=P();if(!good())return toast('Sin fix GPS válido (±'+lim()+' m)');p.poly.vertices.push(mkLoc(fix));save();render()},
 close:()=>{const p=P();p.poly.cerrado=!p.poly.cerrado;save();render()},
 sup:()=>{P().poly.supDecl=$('#sup').value;save();toast('Superficie declarada guardada')},
 use:d=>{db.active=d.id;save();render()},
 create:()=>create(),demo:()=>demo(),
 csv:()=>dl(`${P().code}.csv`,toCSV(P()),'text/csv'),gj:()=>dl(`${P().code}_geo.json`,JSON.stringify(toGeo(P()),null,1),'application/json'),
 svg:()=>dl(`${P().code}_diagrama.svg`,svg(P()),'image/svg+xml'),
 bak:async()=>{const p=P();if(await dl(`${p.code}_respaldo.json`,JSON.stringify({app:'Contar Planta',schema:1,exportado:now(),project:p},null,1),'application/json')){save();p.lastBackup=p.mod;render()}},
 imp:d=>doImport(d.m),

h+='<h2>Resumen por especie</h2><table><tr><th>Especie</th><th>C</th><th>S</th><th>D</th><th>M</th><th>V</th><th>Prendimiento</th><th>Mortalidad</th></tr>'+Object.entries(s.sp).map(([id,t])=>{const sp=spOf(p,id),n=t.sana+t.danada+t.muerta;return`<tr><td>${safe(sp?.nombre||sp?.abbr||id)}</td><td>${t.sana+t.danada+t.muerta+t.vacia}</td><td>${t.sana}</td><td>${t.danada}</td><td>${t.muerta}</td><td>${t.vacia}</td><td>${kpi(t.sana+t.danada,n)}</td><td>${kpi(t.muerta,n)}</td></tr>`}).join('')+'</table>';if(p.obs)h+='<h2>Observaciones del proyecto</h2><p>'+safe(p.obs)+'</p>';h+='<h2>Resumen por hilera</h2><table><tr><th>Hilera</th><th>Estado</th><th>C</th><th>S</th><th>D</th><th>M</th><th>V</th><th>Sin GPS</th></tr>'+p.rows.map(r=>{const t=stats(p,r.id);return`<tr><td>${safe(r.code)}</td><td>${safe(r.estado)}</td><td>${t.C}</td><td>${t.sana}</td><td>${t.danada}</td><td>${t.muerta}</td><td>${t.vacia}</td><td>${t.sc}</td></tr>`}).join('')+'</table><h2>Detalle de posiciones</h2><table><tr><th>Hilera</th><th>Posición</th><th>Código</th><th>Especie</th><th>Estado</th><th>Fecha/hora</th><th>Latitud</th><th>Longitud</th><th>Precisión (m)</th><th>Observaciones</th><th>Evaluaciones</th></tr>';
positions.forEach(x=>{const e=cur(x),r=p.rows.find(y=>y.id===x.rowId),sp=spOf(p,e.sp),l=e.loc||x.loc;h+=`<tr><td>${safe(r?.code)}</td><td>${x.n}</td><td>${safe(x.code)}</td><td>${safe(sp?.nombre||sp?.abbr)}</td><td>${safe(ST[e.estado]?.n||e.estado)}</td><td>${safe(e.t)}</td><td>${l?fmt(l.lat):'—'}</td><td>${l?fmt(l.lng):'—'}</td><td>${l&&Number.isFinite(+l.acc)?(+l.acc).toFixed(1):'—'}</td><td>${safe(e.obs)}</td><td>${x.evals.filter(y=>!y.void).length}</td></tr>`});
h+='</table><p style="margin-top:12px">Informe generado desde los datos guardados en este dispositivo. La superficie estimada es una referencia geométrica del marco de plantación, no una medición predial legal.</p>';$('#print').innerHTML=h;setTimeout(()=>window.print(),300)}
function printDiagram(p){if(!p)return;$('#print').innerHTML=`<h2>GRENER® | Contar Planta — Diagrama esquemático</h2><p>${esc(p.predio)} · ${esc(p.code)} · Polígono ${esc(p.poly.code)} · ${esc(p.fecha)}</p>${svg(p)}`;setTimeout(()=>window.print(),300)}
async function downloadDiagramPNG(p){if(!p)return;try{const blob=new Blob([svg(p)],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),img=new Image();img.onload=()=>{const scale=2,canvas=document.createElement('canvas');canvas.width=img.width*scale;canvas.height=img.height*scale;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.scale(scale,scale);ctx.drawImage(img,0,0);URL.revokeObjectURL(url);canvas.toBlob(async b=>{if(b)await dl(`${p.code}_diagrama.png`,b,'image/png');else toast('No se pudo generar el PNG')},'image/png')};img.onerror=()=>{URL.revokeObjectURL(url);toast('No se pudo preparar el diagrama PNG')};img.src=url}catch(e){toast('No se pudo generar el PNG')}}
function toXML(p){const x=esc,po=p.poly;let o=`<?xml version="1.0" encoding="UTF-8"?>\n<!-- Esquema Contar Planta v1: ContarPlanta > Proyecto, Especies/Especie, Hileras/Hilera > Posicion(codigo,id,n,especie,estado,fecha,lat,lng,precision_m,fuente; texto=observaciones). Coordenadas WGS84 (EPSG:4326). -->\n<ContarPlanta schema="1"><Proyecto codigo="${x(p.code)}" predio="${x(p.predio)}" capturador="${x(p.capturador)}" fecha="${x(p.fecha)}" poligono="${x(po.code)}" orientacion="${po.orient}" dSobre_m="${po.dSobre}" dEntre_m="${po.dEntre}"/><Especies>${po.species.map(s=>`<Especie id="${s.id}" abrev="${x(s.abbr)}" nombre="${x(s.nombre)}" cientifico="${x(s.cient)}"/>`).join('')}</Especies><Hileras>`;
 p.rows.forEach(r=>{o+=`<Hilera codigo="${r.code}" estado="${r.estado}" inicio="${r.exc?'extremo_no_nominal':'nominal'}">`;live(p,r.id).sort((a,b)=>a.n-b.n).forEach(z=>{const e=cur(z),l=e.loc||z.loc;o+=`<Posicion codigo="${x(z.code)}" id="${z.id}" n="${z.n}" especie="${e.sp}" estado="${ST[e.estado].n}" fecha="${e.t}"${l?` lat="${l.lat}" lng="${l.lng}" precision_m="${l.acc.toFixed(1)}" fuente="${l.src}"`:''}>${x(e.obs)}</Posicion>`});o+='</Hilera>'});return o+'</Hileras></ContarPlanta>'}
function toKML(p){const x=esc,col={sana:'ff4f8f3f',danada:'ff00c2e6',muerta:'ff1a1a1a',vacia:'ffffffff'};let o=`<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${x(p.predio)} · ${x(p.code)}</name>`+Object.entries(col).map(([k,c])=>`<Style id="${k}"><IconStyle><color>${c}</color><Icon><href>http://maps.google.com/mapfiles/kml/shapes/shaded_dot.png</href></Icon></IconStyle></Style>`).join('');
 live(p).forEach(z=>{const e=cur(z),l=z.loc;if(l)o+=`<Placemark><name>${x(z.code.split('-').slice(-2).join(' '))}</name><styleUrl>#${e.estado}</styleUrl><description>${x(spOf(p,e.sp).nombre)} · ${ST[e.estado].n}</description><Point><coordinates>${l.lng},${l.lat},0</coordinates></Point></Placemark>`});
 p.rows.forEach(r=>{const c=live(p,r.id).filter(z=>z.loc).sort((a,b)=>a.n-b.n).map(z=>z.loc.lng+','+z.loc.lat).join(' ');if(c.includes(' '))o+=`<Placemark><name>${r.code}</name><LineString><coordinates>${c}</coordinates></LineString></Placemark>`});
 const v=p.poly.vertices;if(v.length>2&&p.poly.cerrado){const c=v.concat([v[0]]).map(z=>z.lng+','+z.lat).join(' ');o+=`<Placemark><name>${x(p.poly.code)}</name><Polygon><outerBoundaryIs><LinearRing><coordinates>${c}</coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark>`}return o+'</Document></kml>'}
async function snaps(){const el=$('#snaps');if(!el)return;let h='<b>Copias automáticas en este teléfono</b><small class=m> (cada 5 min, las últimas 3)</small>';for(let i=0;i<3;i++){const v=await kv('r',null,'snap'+i);if(v)h+=`<div class=row style="margin-top:6px;align-items:center"><span>${new Date(v.t).toLocaleString()} · ${v.db.projects.length} proy.</span><button class="b o" data-a=snaprest data-i=${i}>Restaurar</button></div>`}el.innerHTML=h}
let lmap=null;
const ldL=()=>window.L?Promise.resolve():new Promise((r,j)=>{const c=document.createElement('link');c.rel='stylesheet';c.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';document.head.appendChild(c);const e=document.createElement('script');e.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';e.onload=r;e.onerror=j;document.head.appendChild(e)});
async function showMap(p){const el=$('#map');if(!el)return;try{await ldL()}catch(e){el.innerHTML='<div class=w>El mapa necesita internet. Tus datos no se ven afectados.</div>';return}
 if(lmap){lmap.remove();lmap=null}lmap=L.map(el);const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}),sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri'});sat.addTo(lmap);L.control.layers({'Satélite':sat,'Mapa':osm}).addTo(lmap);
 const pts=[];live(p).forEach(x=>{if(!x.loc)return;const e=cur(x),t=ST[e.estado];pts.push([x.loc.lat,x.loc.lng]);L.circleMarker([x.loc.lat,x.loc.lng],{radius:7,color:'#000',weight:e.estado==='vacia'?2:1,fillColor:t.c,fillOpacity:1}).bindTooltip(x.code.split('-').slice(-2).join(' ')+' · '+t.n).addTo(lmap)});
 const v=p.poly.vertices.map(q=>[q.lat,q.lng]);if(v.length>1){(p.poly.cerrado&&v.length>2?L.polygon:L.polyline)(v,{color:'#a9812f',weight:3,fillOpacity:.08}).addTo(lmap);pts.push(...v)}
 pts.length?lmap.fitBounds(pts,{padding:[20,20],maxZoom:20}):lmap.setView([-33.45,-70.65],4)}
async function dl(name,data,mime,share){const b=new Blob([data],{type:mime}),d=await window.claude?.use?.('downloads');
 if(d){try{await d.save({filename:name,data:b});return true}catch(e){toast(e.code==='declined'?'Descarga cancelada':'No se pudo guardar ('+(e.code||'error')+')');return false}}
 if(share){try{const f=new File([b],name,{type:mime});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return true}}catch(e){if(e.name==='AbortError')return false}}
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);toast('Guardado: '+name+' (carpeta Descargas)');return true}

 const v=$('#v'),keep=tab==='cap'&&document.activeElement?.id==='obs'?0:1;
 v.innerHTML=tab==='cap'?vCap(p):tab==='res'?vRes(p):tab==='dat'?vDat(p):tab==='dia'?(p?'<h2>Diagrama esquemático</h2><div class=row style="margin-bottom:6px"><button class="b o" data-a=fit>Ajustar / desplazar</button><button class="b o" data-a=png>Descargar PNG</button><button class="b o" data-a=svg>Descargar SVG</button><button class="b o" data-a=pdfdiag>PDF A4</button></div><div id=sv>'+svg(p)+'</div><p><small class=m>Revisión de conteos, especies y estados. No sustituye al plano geográfico (GeoJSON).</small></p><h2>Mapa de lo levantado</h2><div id=map style="height:380px;border-radius:8px"></div>':'<div class=card>Sin proyecto.</div>'):tab==='exp'?vExp(p):vPry(p);foot();gps();if(tab==='dia'&&p)showMap(p);if(tab==='exp')snaps()}
